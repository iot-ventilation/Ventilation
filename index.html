<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventilation</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --shadow: rgba(0, 0, 0, 0.35);
      --btn-bg: #334155;
      --btn-text: #ffffff;
      --grid-color: #334155;
    }

    [data-theme="light"] {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --shadow: rgba(0, 0, 0, 0.08);
      --btn-bg: #e2e8f0;
      --btn-text: #0f172a;
      --grid-color: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background: var(--bg-body);
      color: var(--text-main);
      padding: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 34px;
      font-weight: 700;
    }

    .theme-toggle {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px var(--shadow);
    }

    .theme-toggle:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }

    .online {
      background: #22c55e;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 35px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 20px var(--shadow);
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 16px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .value {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 14px;
    }

    .normal { background: #22c55e; color: #ffffff; }
    .warning { background: #facc15; color: #111827; }
    .danger { background: #ef4444; color: #ffffff; }

    .charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 25px;
      margin-bottom: 35px;
    }

    .chart-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 20px var(--shadow);
    }

    .chart-card h3 {
      font-size: 20px;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chart-wrapper {
      position: relative;
      height: 280px;
      width: 100%;
    }

    .footer {
      margin-top: 15px;
      background: var(--bg-card);
      padding: 20px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      font-size: 18px;
      box-shadow: 0 4px 15px var(--shadow);
    }

    @media(max-width:700px) {
      body { padding: 15px; }
      .header { flex-direction: column; align-items: stretch; gap: 15px; }
      .header-left { flex-direction: column; align-items: flex-start; gap: 12px; }
      .header h1 { font-size: 24px; }
      .theme-toggle, .online { width: 100%; text-align: center; justify-content: center; }
      .value { font-size: 36px; }
      .charts-container { grid-template-columns: 1fr; }
      .chart-wrapper { height: 220px; }
      .footer { justify-content: center; font-size: 15px; }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-left">
      <h1>Battery Thermal Ventilation Unit</h1>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
        🌙 Dark Mode
      </button>
    </div>
    <div class="online" id="onlineStatus">
      🟢 ONLINE
    </div>
  </div>

  <!-- Cards แสดงอุณหภูมิ 4 ตัว + Volt + Smoke -->
  <div class="cards">
    <div class="card" id="cardTemp1">
      <div class="icon">🌡️</div>
      <div class="title">Temp 1 (Control)</div>
      <div class="value" id="temp1">0.0°C</div>
      <div class="status normal" id="tempStatus1">NORMAL</div>
    </div>

   <div class="card" style="
      position: relative;
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), url('pj304.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    ">
      <div class="icon">🌡️</div>
      <div class="title" style="color: #cbd5e1; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">Temp 2</div>
      <div class="value" id="temp2" style="color: #ffffff; text-shadow: 0 2px 5px rgba(0,0,0,0.8);">0.0°C</div>
    </div>

    <div class="card">
      <div class="icon">🌡️</div>
      <div class="title">Temp 3</div>
      <div class="value" id="temp3">0.0°C</div>
    </div>

    <div class="card">
      <div class="icon">🌡️</div>
      <div class="title">Temp 4</div>
      <div class="value" id="temp4">0.0°C</div>
    </div>

    <div class="card">
      <div class="icon">⚡</div>
      <div class="title">Output Voltage</div>
      <div class="value" id="volt">0.00V</div>
    </div>

    <div class="card">
      <div class="icon">💨</div>
      <div class="title">Smoke Sensor</div>
      <div class="value" id="smoke">0</div>
      <div class="status normal" id="smokeStatus">SAFE</div>
    </div>
  </div>

  <div class="charts-container">
    <div class="chart-card">
      <h3>🌡️ Temperature 1 History (°C)</h3>
      <div class="chart-wrapper">
        <canvas id="tempChart"></canvas>
      </div>
    </div>

    <div class="chart-card">
      <h3>💨 Smoke Level History</h3>
      <div class="chart-wrapper">
        <canvas id="smokeChart"></canvas>
      </div>
    </div>
  </div>

  <div class="footer">
    <div>📅 Date : <span id="currentDate">--/--/----</span></div>
    <div>🕒 Time : <span id="currentTime">--:--:--</span></div>
  </div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzO_0oj5LCJdQT1GHDbr7cgYv81tKY2sNajITdxBFcMvWRD8f-FWfcnF50OVkczhhi4yw/exec";

    const maxDataPoints = 10;
    let chartTimerCounter = 0;

    const getTextColor = () => document.documentElement.getAttribute("data-theme") === "light" ? "#0f172a" : "#ffffff";
    const getGridColor = () => document.documentElement.getAttribute("data-theme") === "light" ? "#e2e8f0" : "#334155";

    // กราฟ Temperature (เส้นเดียวของ Temp 1)
    const ctxTemp = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(ctxTemp, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Temp 1 (°C)',
          data: [],
          borderColor: '#22c55e',
          backgroundColor: 'rgba(34, 197, 94, 0.15)',
          fill: true,
          tension: 0.3,
          borderWidth: 3,
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: getTextColor }, grid: { color: getGridColor } },
          y: { ticks: { color: getTextColor }, grid: { color: getGridColor }, beginAtZero: false }
        }
      }
    });

    // กราฟ Smoke
    const ctxSmoke = document.getElementById('smokeChart').getContext('2d');
    const smokeChart = new Chart(ctxSmoke, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Smoke Value',
          data: [],
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.15)',
          fill: true,
          tension: 0.3,
          borderWidth: 3,
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: getTextColor }, grid: { color: getGridColor } },
          y: { ticks: { color: getTextColor }, grid: { color: getGridColor }, beginAtZero: true }
        }
      }
    });

    function addChartData(chart, label, value, alertType) {
      if (chart.data.labels.length >= maxDataPoints) {
        chart.data.labels = [];
        chart.data.datasets[0].data = [];
      }

      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(value);

      if (chart === tempChart) {
        if (alertType === "danger") {
          chart.data.datasets[0].borderColor = '#ef4444';
          chart.data.datasets[0].backgroundColor = 'rgba(239, 68, 68, 0.2)';
        } else if (alertType === "warning") {
          chart.data.datasets[0].borderColor = '#facc15';
          chart.data.datasets[0].backgroundColor = 'rgba(250, 204, 21, 0.2)';
        } else {
          chart.data.datasets[0].borderColor = '#22c55e';
          chart.data.datasets[0].backgroundColor = 'rgba(34, 197, 94, 0.15)';
        }
      }

      chart.update();
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const btn = document.getElementById("themeToggle");

      if (currentTheme === "light") {
        document.documentElement.setAttribute("data-theme", "dark");
        btn.innerHTML = "🌙 Dark Mode";
        localStorage.setItem("theme", "dark");
      } else {
        document.documentElement.setAttribute("data-theme", "light");
        btn.innerHTML = "☀️ Light Mode";
        localStorage.setItem("theme", "light");
      }

      [tempChart, smokeChart].forEach(chart => {
        chart.options.scales.x.ticks.color = getTextColor();
        chart.options.scales.x.grid.color = getGridColor();
        chart.options.scales.y.ticks.color = getTextColor();
        chart.options.scales.y.grid.color = getGridColor();
        chart.update();
      });
    }

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "light") {
      document.documentElement.setAttribute("data-theme", "light");
      document.getElementById("themeToggle").innerHTML = "☀️ Light Mode";
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("currentDate").innerText = now.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' });
      document.getElementById("currentTime").innerText = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    }
    updateClock();
    setInterval(updateClock, 1000);

    async function updateDashboard() {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        let online = document.getElementById("onlineStatus");
        let tempStatus1 = document.getElementById("tempStatus1");
        let smokeStatus = document.getElementById("smokeStatus");
        const timeNow = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        if (data.status === "offline") {
          online.innerHTML = "🔴 OFFLINE";
          online.style.background = "#ef4444";

          document.getElementById("temp1").innerHTML = "0.0°C";
          document.getElementById("temp2").innerHTML = "0.0°C";
          document.getElementById("temp3").innerHTML = "0.0°C";
          document.getElementById("temp4").innerHTML = "0.0°C";
          document.getElementById("volt").innerHTML = "0.00V";
          document.getElementById("smoke").innerHTML = "0";

          tempStatus1.className = "status normal";
          tempStatus1.innerHTML = "NORMAL";
          smokeStatus.className = "status normal";
          smokeStatus.innerHTML = "SAFE";
        } 
        else {
          online.innerHTML = "🟢 ONLINE";
          online.style.background = "#22c55e";

          let t1 = parseFloat(data.temp1 || 0);
          let t2 = parseFloat(data.temp2 || 0);
          let t3 = parseFloat(data.temp3 || 0);
          let t4 = parseFloat(data.temp4 || 0);
          let volt = parseFloat(data.volt || 0);
          let smoke = parseInt(data.smoke || 0);

          document.getElementById("temp1").innerHTML = t1.toFixed(1) + "°C";
          document.getElementById("temp2").innerHTML = t2.toFixed(1) + "°C";
          document.getElementById("temp3").innerHTML = t3.toFixed(1) + "°C";
          document.getElementById("temp4").innerHTML = t4.toFixed(1) + "°C";
          document.getElementById("volt").innerHTML = volt.toFixed(2) + "V";
          document.getElementById("smoke").innerHTML = smoke;

          // สถานะ Temp 1
          let tempAlertType = "normal";
          tempStatus1.className = "status";
          if (t1 >= 50) {
            tempStatus1.innerHTML = "DANGER";
            tempStatus1.classList.add("danger");
            tempAlertType = "danger";
          } else if (t1 >= 40) {
            tempStatus1.innerHTML = "WARNING";
            tempStatus1.classList.add("warning");
            tempAlertType = "warning";
          } else {
            tempStatus1.innerHTML = "NORMAL";
            tempStatus1.classList.add("normal");
          }

          // สถานะ Smoke
          let smokeAlertType = "normal";
          smokeStatus.className = "status";
          if (smoke <= 200) {
            smokeStatus.innerHTML = "SAFE";
            smokeStatus.classList.add("normal");
          } else if (smoke <= 500) {
            smokeStatus.innerHTML = "WARNING";
            smokeStatus.classList.add("warning");
            smokeAlertType = "warning";
          } else {
            smokeStatus.innerHTML = "DANGER";
            smokeStatus.classList.add("danger");
            smokeAlertType = "danger";
          }

          // บันทึกลงกราฟ Temp 1 และ Smoke ทุกๆ 30 วินาที
          if (tempChart.data.labels.length === 0) {
            addChartData(tempChart, timeNow, t1, tempAlertType);
            addChartData(smokeChart, timeNow, smoke, smokeAlertType);
            chartTimerCounter = 0;
          } else {
            chartTimerCounter++;
            if (chartTimerCounter >= 30) {
              addChartData(tempChart, timeNow, t1, tempAlertType);
              addChartData(smokeChart, timeNow, smoke, smokeAlertType);
              chartTimerCounter = 0;
            }
          }
        }

      } catch (err) {
        console.log("Fetch Error:", err);
      }
    }

    updateDashboard();
    setInterval(updateDashboard, 1000);

    function flash(id) {
      const obj = document.getElementById(id);
      if (obj) {
        obj.style.transform = "scale(1.08)";
        obj.style.transition = "0.25s";
        setTimeout(() => { obj.style.transform = "scale(1)"; }, 250);
      }
    }

    setInterval(() => {
      flash("temp1");
      flash("volt");
      flash("smoke");
    }, 3000);
  </script>

</body>

</html>
